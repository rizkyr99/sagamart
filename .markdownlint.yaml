# Docs use long lines and tables; keep the rules that catch real mistakes.
default: true
MD013: false # line length
MD024:
  siblings_only: true # repeated headings under different parents (e.g. ADR options)
MD033: false # inline HTML (<br/> in Mermaid labels and tables)
MD041: false # first line heading (templates start with a comment)
MD036: false # bold labels such as **Goals** are a deliberate style in RFCs and the PRD
