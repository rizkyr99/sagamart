openapi: 3.1.0
info:
  title: Sagamart public API
  version: 1.0.0
  summary: The API the storefront, admin tools and load tests call, served by the gateway.
  description: |
    Defined in [RFC-0005](https://github.com/rizkyr99/sagamart/blob/main/docs/rfc/0005-catalog-cart-gateway.md).

    - JSON fields are camelCase; money is whole rupiah with a currency (`IDR`).
    - Errors are RFC 9457 Problem Details (`application/problem+json`) with a stable `code`.
    - Stock shown on product and cart views is a snapshot. Inventory's reservation at checkout is the authority.
      If Inventory doesn't answer within 150 ms, stock is `UNKNOWN` and the page still renders.
    - Every request is traced; Problem Details carry the `traceId`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8100
    description: Local gateway (`make demo`)

tags:
  - name: Catalog
    description: Browse categories and products (FR-01, FR-03).
  - name: Cart
    description: Guest and signed-in carts (FR-04).
  - name: Orders
    description: Checkout and order status (J3, FR-06–FR-08). Buyers must be signed in.
  - name: Admin
    description: Product, category and stock management (FR-11), and orders with their saga steps (FR-12). Requires the `admin` role.
  - name: Development
    description: Only present when the gateway runs with `GATEWAY_DEV_AUTH=true`, never in `prod`.

security: []

paths:
  /v1/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List all categories
      responses:
        "200":
          description: Every category, flat; build the tree from `parentId`.
          content:
            application/json:
              schema: { $ref: "components/common-v1.yaml#/components/schemas/CategoryList" }
              example:
                items:
                  - { id: 0199f2d0-1a2b-7c3d-8e4f-5a6b7c8d9e01, slug: kaos, name: Kaos, parentId: null, position: 0 }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List active products
      description: Keyset-paginated. Filters apply to each product's lowest active SKU price.
      parameters:
        - { $ref: "components/common-v1.yaml#/components/parameters/Category" }
        - { $ref: "components/common-v1.yaml#/components/parameters/MinPrice" }
        - { $ref: "components/common-v1.yaml#/components/parameters/MaxPrice" }
        - { $ref: "components/common-v1.yaml#/components/parameters/Sort" }
        - { $ref: "components/common-v1.yaml#/components/parameters/Limit" }
        - { $ref: "components/common-v1.yaml#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
              example:
                items:
                  - id: 0199f2d1-2b3c-7d4e-9f50-6a7b8c9d0e12
                    slug: kaos-polos-hitam
                    name: Kaos Polos Hitam
                    category: { id: 0199f2d0-1a2b-7c3d-8e4f-5a6b7c8d9e01, slug: kaos, name: Kaos }
                    imageUrl: https://images.sagamart.dev/kaos-polos-hitam-1.jpg
                    fromPrice: { amount: 79000, currency: IDR }
                    stockStatus: LOW_STOCK
                nextCursor: eyJxIjoiOWYxYyIsInQiOiIyMDI2LTEwLTIyVDAzOjAwOjAwLjAwMFoiLCJpZCI6IjAxOTlmMmQxIn0
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/products/{slug}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Get an active product with its SKUs and live stock
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: "components/common-v1.yaml#/components/schemas/Slug" }
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
              example:
                id: 0199f2d1-2b3c-7d4e-9f50-6a7b8c9d0e12
                slug: kaos-polos-hitam
                name: Kaos Polos Hitam
                description: Kaos katun 100%, potongan reguler.
                category: { id: 0199f2d0-1a2b-7c3d-8e4f-5a6b7c8d9e01, slug: kaos, name: Kaos }
                imageUrls: ["https://images.sagamart.dev/kaos-polos-hitam-1.jpg"]
                fromPrice: { amount: 79000, currency: IDR }
                stockStatus: IN_STOCK
                skus:
                  - { sku: KAOS-001-M, name: M / Hitam, price: { amount: 79000, currency: IDR }, available: 12, stockStatus: IN_STOCK }
                  - { sku: KAOS-001-L, name: L / Hitam, price: { amount: 79000, currency: IDR }, available: 0, stockStatus: OUT_OF_STOCK }
        "404": { $ref: "components/common-v1.yaml#/components/responses/NotFound" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/cart/guest-token:
    post:
      tags: [Cart]
      operationId: createGuestCartToken
      summary: Get a token for a guest cart
      description: |
        Writes nothing. The cart is created by the first `PUT /v1/cart/lines/{sku}` carrying the token,
        so a lost response is harmless: ask again. Signed-in buyers don't need a token.
      responses:
        "201":
          description: A new token. Send it as `X-Cart-Token` on cart calls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestCartToken" }
              example: { token: "EXAMPLE_guest_token_00" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }

  /v1/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get the current cart with current prices and availability
      description: An unknown or expired guest token, or a buyer with no cart, gets an empty cart.
      security:
        - bearerAuth: []
        - cartToken: []
      responses:
        "200":
          description: The cart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
              examples:
                cart: { $ref: "#/components/examples/Cart" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/cart/lines/{sku}:
    parameters:
      - name: sku
        in: path
        required: true
        schema: { $ref: "components/common-v1.yaml#/components/schemas/Sku" }
    put:
      tags: [Cart]
      operationId: setCartLine
      summary: Set a line's quantity (0 removes it)
      description: Idempotent. Creates the cart on the first write. The price snapshot is the SKU's current price.
      security:
        - bearerAuth: []
        - cartToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartLineQuantity" }
            example: { quantity: 2 }
      responses:
        "200":
          description: The updated cart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
              examples:
                cart: { $ref: "#/components/examples/Cart" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "components/common-v1.yaml#/components/responses/NotFound" }
        "422": { $ref: "components/common-v1.yaml#/components/responses/Unprocessable" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }
    delete:
      tags: [Cart]
      operationId: removeCartLine
      summary: Remove a line
      description: Idempotent; removing a line that isn't there returns the cart unchanged.
      security:
        - bearerAuth: []
        - cartToken: []
      responses:
        "200":
          description: The updated cart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/admin/categories:
    post:
      tags: [Admin]
      operationId: createCategory
      summary: Create a category
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "components/common-v1.yaml#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "components/catalog-v1.yaml#/components/schemas/CategoryCreate" }
            example: { slug: kaos, name: Kaos }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "components/common-v1.yaml#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "components/common-v1.yaml#/components/schemas/Category" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "409": { $ref: "components/common-v1.yaml#/components/responses/Conflict" }
        "422": { $ref: "components/common-v1.yaml#/components/responses/Unprocessable" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/admin/categories/{id}:
    patch:
      tags: [Admin]
      operationId: updateCategory
      summary: Edit a category
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "components/common-v1.yaml#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "components/catalog-v1.yaml#/components/schemas/CategoryPatch" }
            example: { name: Kaos Pria }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "components/common-v1.yaml#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "components/common-v1.yaml#/components/schemas/Category" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "components/common-v1.yaml#/components/responses/NotFound" }
        "412": { $ref: "components/common-v1.yaml#/components/responses/PreconditionFailed" }
        "428": { $ref: "components/common-v1.yaml#/components/responses/PreconditionRequired" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/admin/products:
    get:
      tags: [Admin]
      operationId: listAdminProducts
      summary: List products in any status
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "components/common-v1.yaml#/components/schemas/ProductStatus" }
        - { $ref: "components/common-v1.yaml#/components/parameters/Limit" }
        - { $ref: "components/common-v1.yaml#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of products, newest first.
          content:
            application/json:
              schema: { $ref: "components/catalog-v1.yaml#/components/schemas/AdminProductPage" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }
    post:
      tags: [Admin]
      operationId: createProduct
      summary: Create a product with its SKUs
      description: Creating SKUs doesn't create stock; set it with `PUT /v1/admin/skus/{sku}/stock`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "components/common-v1.yaml#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "components/catalog-v1.yaml#/components/schemas/ProductCreate" }
            examples:
              tshirt: { $ref: "components/catalog-v1.yaml#/components/examples/ProductCreate" }
      responses:
        "201":
          description: Created (or the original response, for a retry with the same key and body).
          headers:
            ETag: { $ref: "components/common-v1.yaml#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "components/catalog-v1.yaml#/components/schemas/AdminProduct" }
              examples:
                tshirt: { $ref: "components/catalog-v1.yaml#/components/examples/AdminProduct" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "409": { $ref: "components/common-v1.yaml#/components/responses/Conflict" }
        "422": { $ref: "components/common-v1.yaml#/components/responses/Unprocessable" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/admin/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Admin]
      operationId: getAdminProduct
      summary: Get a product in any status, with its version
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The product.
          headers:
            ETag: { $ref: "components/common-v1.yaml#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "components/catalog-v1.yaml#/components/schemas/AdminProduct" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "components/common-v1.yaml#/components/responses/NotFound" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }
    patch:
      tags: [Admin]
      operationId: updateProduct
      summary: Edit a product
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "components/common-v1.yaml#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "components/catalog-v1.yaml#/components/schemas/ProductPatch" }
            example: { status: ARCHIVED }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "components/common-v1.yaml#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "components/catalog-v1.yaml#/components/schemas/AdminProduct" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "components/common-v1.yaml#/components/responses/NotFound" }
        "412": { $ref: "components/common-v1.yaml#/components/responses/PreconditionFailed" }
        "422": { $ref: "components/common-v1.yaml#/components/responses/Unprocessable" }
        "428": { $ref: "components/common-v1.yaml#/components/responses/PreconditionRequired" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/admin/products/{id}/skus:
    post:
      tags: [Admin]
      operationId: addSku
      summary: Add a variant to a product
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "components/common-v1.yaml#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "components/catalog-v1.yaml#/components/schemas/SkuCreate" }
            example: { sku: KAOS-001-XL, name: XL / Hitam, price: { amount: 85000, currency: IDR } }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "components/common-v1.yaml#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "components/catalog-v1.yaml#/components/schemas/AdminSku" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "components/common-v1.yaml#/components/responses/NotFound" }
        "409": { $ref: "components/common-v1.yaml#/components/responses/Conflict" }
        "422": { $ref: "components/common-v1.yaml#/components/responses/Unprocessable" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/admin/skus/{sku}:
    patch:
      tags: [Admin]
      operationId: updateSku
      summary: Edit a variant's name, price or status
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: "components/common-v1.yaml#/components/schemas/Sku" } }
        - { $ref: "components/common-v1.yaml#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "components/catalog-v1.yaml#/components/schemas/SkuPatch" }
            example: { price: { amount: 69000, currency: IDR } }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "components/common-v1.yaml#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "components/catalog-v1.yaml#/components/schemas/AdminSku" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "components/common-v1.yaml#/components/responses/NotFound" }
        "412": { $ref: "components/common-v1.yaml#/components/responses/PreconditionFailed" }
        "422": { $ref: "components/common-v1.yaml#/components/responses/Unprocessable" }
        "428": { $ref: "components/common-v1.yaml#/components/responses/PreconditionRequired" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/admin/skus/{sku}/stock:
    put:
      tags: [Admin]
      operationId: setStockLevel
      summary: Set a SKU's on-hand stock
      description: |
        Calls Inventory's `SetStockLevel`. `expectedVersion` 0 creates the stock record.
        Both precondition failures are `409` with `currentVersion`, `onHand` and `reserved`, so the admin can retry correctly.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: "components/common-v1.yaml#/components/schemas/Sku" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetStock" }
            example: { onHand: 100, expectedVersion: 0 }
      responses:
        "200":
          description: The new stock level.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockLevel" }
              example: { sku: KAOS-001-M, onHand: 100, reserved: 0, available: 100, version: 1 }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "409":
          description: '`VERSION_CONFLICT` (another change came first) or `STOCK_BELOW_RESERVED` (`onHand` below what reservations hold).'
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/StockConflict" }
              example:
                type: https://sagamart.dev/errors/stock-below-reserved
                title: Stock below reserved
                status: 409
                code: STOCK_BELOW_RESERVED
                detail: KAOS-001-M has 4 units reserved.
                currentVersion: 7
                onHand: 10
                reserved: 4
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/checkout:
    post:
      tags: [Orders]
      operationId: checkout
      summary: Check out the signed-in buyer's cart
      description: |
        Turns the buyer's cart into an order at Catalog's current prices, reserves the stock and starts the payment
        ([RFC-0002](https://github.com/rizkyr99/sagamart/blob/main/docs/rfc/0002-checkout-saga.md)). No guest checkout:
        buyers sign in first.

        - **`Idempotency-Key` required.** A retry with the same key and body returns the original order, even after
          the cart was cleared; the same key with another body is `422 IDEMPOTENCY_KEY_REUSED`.
        - **`expectedTotal`** is the total the buyer saw. If prices changed, the answer is `409 PRICE_CHANGED` with the
          current total, and nothing is ordered.
        - The cart's lines are cleared after a `202`.
        - The reply usually carries `paymentUrl`. If the first steps take longer than the gateway can wait, `status` is
          `PENDING` without one: poll `GET /v1/orders/{orderId}` until it appears.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "components/common-v1.yaml#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
            examples:
              checkout: { $ref: "#/components/examples/CheckoutRequest" }
      responses:
        "202":
          description: Accepted; the saga is running. Pay at `paymentUrl`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              examples:
                awaitingPayment: { $ref: "#/components/examples/OrderAwaitingPayment" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "409":
          description: '`PRICE_CHANGED` (carries `currentTotal`) or `INSUFFICIENT_STOCK` (carries `shortfalls`; the order is recorded `CANCELLED`).'
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/CheckoutConflict" }
              example:
                type: https://sagamart.dev/errors/price-changed
                title: Conflict
                status: 409
                code: PRICE_CHANGED
                detail: The total is now 168,000 IDR.
                expectedTotal: { amount: 158000, currency: IDR }
                currentTotal: { amount: 168000, currency: IDR }
        "422": { $ref: "components/common-v1.yaml#/components/responses/Unprocessable" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order and its status
      description: The buyer's own orders, or any order for an admin; anyone else gets `404`, so order IDs can't be probed.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              examples:
                awaitingPayment: { $ref: "#/components/examples/OrderAwaitingPayment" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "components/common-v1.yaml#/components/responses/NotFound" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/admin/orders:
    get:
      tags: [Admin]
      operationId: listOrders
      summary: List orders, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { $ref: "components/common-v1.yaml#/components/parameters/Limit" }
        - { $ref: "components/common-v1.yaml#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/admin/orders/{orderId}/saga:
    get:
      tags: [Admin]
      operationId: getOrderSaga
      summary: An order's saga state and every step (FR-12)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The saga, with its steps oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saga" }
              examples:
                confirmed: { $ref: "#/components/examples/SagaConfirmed" }
        "401": { $ref: "components/common-v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "components/common-v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "components/common-v1.yaml#/components/responses/NotFound" }
        "429": { $ref: "components/common-v1.yaml#/components/responses/TooManyRequests" }
        "503": { $ref: "components/common-v1.yaml#/components/responses/Unavailable" }

  /v1/dev/token:
    post:
      tags: [Development]
      operationId: issueDevToken
      summary: Issue a development JWT (dev only)
      description: Exists only with `GATEWAY_DEV_AUTH=true`; the gateway refuses to start with it in `prod`. Replaced by OIDC at Core complete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevTokenRequest" }
            example: { role: admin, userId: 0199f2e0-0000-7000-8000-000000000001 }
      responses:
        "200":
          description: A signed token, valid for one hour.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevToken" }
              example: { token: "<development JWT>", expiresAt: "2026-10-22T04:00:00.000Z" }
        "400": { $ref: "components/common-v1.yaml#/components/responses/BadRequest" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A development JWT until Core complete (`POST /v1/dev/token`), then an OIDC access token.
    cartToken:
      type: apiKey
      in: header
      name: X-Cart-Token
      description: A guest cart token from `POST /v1/cart/guest-token`.

  schemas:
    StockStatus:
      description: '`LOW_STOCK` is 1–5 available; `UNKNOWN` means Inventory didn''t answer in time or doesn''t know the SKU.'
      type: string
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK, UNKNOWN]

    ProductSummary:
      allOf:
        - $ref: "components/catalog-v1.yaml#/components/schemas/ProductSummaryBase"
        - type: object
          required: [stockStatus]
          properties:
            stockStatus:
              $ref: "#/components/schemas/StockStatus"
              description: The best known status of the product's SKUs; `UNKNOWN` only if none is known to be available and one is unknown.

    ProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProductSummary" } }
        nextCursor: { type: [string, "null"], description: "Pass as `cursor` for the next page; null on the last page." }

    SkuView:
      allOf:
        - $ref: "components/catalog-v1.yaml#/components/schemas/SkuBase"
        - type: object
          required: [available, stockStatus]
          properties:
            available: { type: [integer, "null"], minimum: 0, description: "Null when `stockStatus` is `UNKNOWN`." }
            stockStatus: { $ref: "#/components/schemas/StockStatus" }

    ProductDetail:
      allOf:
        - $ref: "components/catalog-v1.yaml#/components/schemas/ProductDetailBase"
        - type: object
          required: [stockStatus, skus]
          properties:
            stockStatus: { $ref: "#/components/schemas/StockStatus" }
            skus:
              type: array
              minItems: 1
              maxItems: 100
              items: { $ref: "#/components/schemas/SkuView" }

    GuestCartToken:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{22}$", description: "128 random bits, base64url without padding." }

    CartLineQuantity:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 0, maximum: 100, description: "0 removes the line." }
      additionalProperties: false

    CartLine:
      type: object
      required: [sku, productSlug, productName, skuName, quantity, priceSnapshot, price, priceChanged, available, exceedsAvailable, stockStatus]
      properties:
        sku: { $ref: "components/common-v1.yaml#/components/schemas/Sku" }
        productSlug: { $ref: "components/common-v1.yaml#/components/schemas/Slug" }
        productName: { type: string }
        skuName: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        priceSnapshot: { $ref: "components/common-v1.yaml#/components/schemas/PositiveMoney", description: "The price when the line was last set." }
        price:
          description: The current price; null if the SKU is no longer sold.
          oneOf:
            - $ref: "components/common-v1.yaml#/components/schemas/PositiveMoney"
            - type: "null"
        priceChanged: { type: boolean }
        available: { type: [integer, "null"], minimum: 0, description: "Null when stock is `UNKNOWN`." }
        exceedsAvailable: { type: [boolean, "null"], description: "True when `quantity` > `available`; null when stock is `UNKNOWN`." }
        stockStatus: { $ref: "#/components/schemas/StockStatus" }

    Cart:
      type: object
      required: [lines, lineCount, total, expiresAt]
      properties:
        lines: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/CartLine" } }
        lineCount: { type: integer, minimum: 0, maximum: 50 }
        total: { $ref: "components/common-v1.yaml#/components/schemas/Money", description: "Sum of quantity × current price over lines still sold." }
        expiresAt: { type: [string, "null"], format: date-time, description: "Seven days after the last change; null for an empty cart." }

    SetStock:
      type: object
      required: [onHand, expectedVersion]
      properties:
        onHand: { type: integer, format: int64, minimum: 0 }
        expectedVersion: { type: integer, format: int64, minimum: 0, description: "The current `version`, or 0 to create." }
      additionalProperties: false

    StockLevel:
      type: object
      required: [sku, onHand, reserved, available, version]
      properties:
        sku: { $ref: "components/common-v1.yaml#/components/schemas/Sku" }
        onHand: { type: integer, format: int64, minimum: 0 }
        reserved: { type: integer, format: int64, minimum: 0 }
        available: { type: integer, format: int64, minimum: 0 }
        version: { type: integer, format: int64, minimum: 1 }

    StockConflict:
      allOf:
        - $ref: "components/common-v1.yaml#/components/schemas/Problem"
        - type: object
          required: [currentVersion, onHand, reserved]
          properties:
            code: { type: string, enum: [VERSION_CONFLICT, STOCK_BELOW_RESERVED] }
            currentVersion: { type: integer, format: int64, minimum: 0, description: "0 if the SKU has no stock record yet." }
            onHand: { type: integer, format: int64, minimum: 0 }
            reserved: { type: integer, format: int64, minimum: 0 }

    DevTokenRequest:
      type: object
      required: [role, userId]
      properties:
        role: { type: string, enum: [buyer, admin] }
        userId: { type: string, format: uuid }
      additionalProperties: false

    DevToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    ShippingAddress:
      description: Personal data, kept in the Order service only (RFC-0002 §8).
      type: object
      required: [name, phone, addressLine, city, province, postalCode]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, pattern: "^\\+?[0-9][0-9 -]{5,19}$", example: "+62 812 3456 7890" }
        addressLine: { type: string, minLength: 1, maxLength: 300 }
        city: { type: string, minLength: 1, maxLength: 100 }
        province: { type: string, minLength: 1, maxLength: 100 }
        postalCode: { type: string, pattern: "^[0-9]{5}$", example: "12190" }
      additionalProperties: false

    CheckoutRequest:
      type: object
      required: [expectedTotal, shippingAddress, paymentMethod]
      properties:
        expectedTotal: { $ref: "components/common-v1.yaml#/components/schemas/PositiveMoney" }
        shippingAddress: { $ref: "#/components/schemas/ShippingAddress" }
        paymentMethod: { type: string, enum: [MOCK_CARD] }
      additionalProperties: false

    OrderStatus:
      type: string
      enum: [PENDING, AWAITING_PAYMENT, PAID, CONFIRMED, CANCELLED]

    CancelReason:
      type: string
      enum: [INSUFFICIENT_STOCK, PAYMENT_FAILED, PAYMENT_TIMEOUT, STOCK_UNAVAILABLE, PAYMENT_UNAVAILABLE]

    OrderLine:
      type: object
      required: [sku, name, unitPrice, quantity]
      properties:
        sku: { $ref: "components/common-v1.yaml#/components/schemas/Sku" }
        name: { type: string, description: "Product and variant name at order time." }
        unitPrice: { $ref: "components/common-v1.yaml#/components/schemas/PositiveMoney" }
        quantity: { type: integer, minimum: 1, maximum: 100 }

    Order:
      type: object
      required: [orderId, buyerId, status, cancelReason, lines, total, shippingAddress, paymentUrl, createdAt, updatedAt]
      properties:
        orderId: { type: string, format: uuid }
        buyerId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OrderStatus" }
        cancelReason:
          description: Set when `status` is `CANCELLED`.
          oneOf:
            - $ref: "#/components/schemas/CancelReason"
            - type: "null"
        lines: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/OrderLine" } }
        total: { $ref: "components/common-v1.yaml#/components/schemas/PositiveMoney" }
        shippingAddress: { $ref: "#/components/schemas/ShippingAddress" }
        paymentUrl: { type: [string, "null"], format: uri, description: "Where to pay; set while `status` is `AWAITING_PAYMENT`." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Order" } }
        nextCursor: { type: [string, "null"] }

    SagaState:
      description: The orchestrator's internal progress (RFC-0002 §4.4); not shown to buyers.
      type: string
      enum: [RESERVING_STOCK, CREATING_PAYMENT, AWAITING_PAYMENT, COMMITTING_STOCK, COMPLETED, CANCELLING, REFUNDING, CANCELLED, NEEDS_ATTENTION]

    SagaStep:
      type: object
      required: [seq, kind, name, fromState, toState, attempt, outcome, detail, at]
      properties:
        seq: { type: integer, minimum: 1 }
        kind: { type: string, enum: [EVENT, COMMAND, TRANSITION] }
        name: { type: string, description: "A command (ReserveStock, ...) or an event (payment.succeeded, PaymentDeadlinePassed, ...).", example: ReserveStock }
        fromState:
          oneOf:
            - $ref: "#/components/schemas/SagaState"
            - type: "null"
        toState:
          oneOf:
            - $ref: "#/components/schemas/SagaState"
            - type: "null"
        attempt: { type: [integer, "null"], minimum: 1, description: "For commands: 1 for the first try." }
        outcome: { type: [string, "null"], enum: [OK, RETRYABLE_ERROR, FAILED, null] }
        detail: { type: [string, "null"], description: "Error code and message of a failed or retried command; never personal data." }
        at: { type: string, format: date-time }

    Saga:
      type: object
      required: [orderId, state, paymentDeadline, steps]
      properties:
        orderId: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/SagaState" }
        paymentDeadline: { type: [string, "null"], format: date-time, description: "When an awaiting-payment saga gives up on the payment." }
        steps: { type: array, items: { $ref: "#/components/schemas/SagaStep" } }

    CheckoutConflict:
      allOf:
        - $ref: "components/common-v1.yaml#/components/schemas/Problem"
        - type: object
          properties:
            code: { type: string, enum: [PRICE_CHANGED, INSUFFICIENT_STOCK] }
            expectedTotal: { $ref: "components/common-v1.yaml#/components/schemas/PositiveMoney" }
            currentTotal: { $ref: "components/common-v1.yaml#/components/schemas/PositiveMoney" }
            orderId: { type: string, format: uuid, description: "INSUFFICIENT_STOCK: the order, recorded as CANCELLED." }
            shortfalls:
              type: array
              items:
                type: object
                required: [sku, requested, available]
                properties:
                  sku: { $ref: "components/common-v1.yaml#/components/schemas/Sku" }
                  requested: { type: integer, minimum: 1 }
                  available: { type: integer, minimum: 0 }

  examples:
    Cart:
      value:
        lineCount: 1
        total: { amount: 158000, currency: IDR }
        expiresAt: "2026-10-29T03:15:00.000Z"
        lines:
          - sku: KAOS-001-M
            productSlug: kaos-polos-hitam
            productName: Kaos Polos Hitam
            skuName: M / Hitam
            quantity: 2
            priceSnapshot: { amount: 79000, currency: IDR }
            price: { amount: 79000, currency: IDR }
            priceChanged: false
            available: 12
            exceedsAvailable: false
            stockStatus: IN_STOCK
    CheckoutRequest:
      value:
        expectedTotal: { amount: 158000, currency: IDR }
        shippingAddress:
          name: Siti Rahma
          phone: "+62 812 3456 7890"
          addressLine: Jl. Sudirman No. 1
          city: Jakarta Selatan
          province: DKI Jakarta
          postalCode: "12190"
        paymentMethod: MOCK_CARD
    OrderAwaitingPayment:
      value:
        orderId: 0199f2b1-7a10-7b2c-9d3e-4f5a6b7c8d01
        buyerId: 0199f2e0-0000-7000-8000-000000000001
        status: AWAITING_PAYMENT
        cancelReason: null
        lines:
          - { sku: KAOS-001-M, name: Kaos Polos Hitam M / Hitam, unitPrice: { amount: 79000, currency: IDR }, quantity: 2 }
        total: { amount: 158000, currency: IDR }
        shippingAddress:
          name: Siti Rahma
          phone: "+62 812 3456 7890"
          addressLine: Jl. Sudirman No. 1
          city: Jakarta Selatan
          province: DKI Jakarta
          postalCode: "12190"
        paymentUrl: http://localhost:8130/pay/0199f2b1-7b22-7c31-a4d5-6e7f8091a2b4
        createdAt: "2026-10-26T03:10:00.000Z"
        updatedAt: "2026-10-26T03:10:00.640Z"
    SagaConfirmed:
      value:
        orderId: 0199f2b1-7a10-7b2c-9d3e-4f5a6b7c8d01
        state: COMPLETED
        paymentDeadline: null
        steps:
          - { seq: 1, kind: COMMAND, name: ReserveStock, fromState: RESERVING_STOCK, toState: null, attempt: 1, outcome: OK, detail: null, at: "2026-10-26T03:10:00.120Z" }
          - { seq: 2, kind: TRANSITION, name: StockReserved, fromState: RESERVING_STOCK, toState: CREATING_PAYMENT, attempt: null, outcome: null, detail: null, at: "2026-10-26T03:10:00.121Z" }
          - { seq: 3, kind: COMMAND, name: CreatePaymentIntent, fromState: CREATING_PAYMENT, toState: null, attempt: 1, outcome: OK, detail: null, at: "2026-10-26T03:10:00.630Z" }
          - { seq: 4, kind: TRANSITION, name: IntentCreated, fromState: CREATING_PAYMENT, toState: AWAITING_PAYMENT, attempt: null, outcome: null, detail: null, at: "2026-10-26T03:10:00.631Z" }
          - { seq: 5, kind: EVENT, name: payment.succeeded, fromState: AWAITING_PAYMENT, toState: COMMITTING_STOCK, attempt: null, outcome: null, detail: null, at: "2026-10-26T03:12:40.300Z" }
          - { seq: 6, kind: COMMAND, name: CommitReservation, fromState: COMMITTING_STOCK, toState: null, attempt: 1, outcome: OK, detail: null, at: "2026-10-26T03:12:40.880Z" }
          - { seq: 7, kind: TRANSITION, name: StockCommitted, fromState: COMMITTING_STOCK, toState: COMPLETED, attempt: null, outcome: null, detail: null, at: "2026-10-26T03:12:40.881Z" }
