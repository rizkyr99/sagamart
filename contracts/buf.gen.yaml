# Generated Go code is committed under gen/go (its own Go module) so services build without a codegen step.
# CI regenerates it and fails on any diff. Java code is generated at build time by the Order service.
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt: paths=source_relative
