# One workflow for every PR. `changes` decides which areas are affected, area jobs run only when needed,
# and the final `ci` job is the single required check on main: it fails if any job that ran failed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      contracts: ${{ steps.filter.outputs.contracts }}
      inventory: ${{ steps.filter.outputs.inventory }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A change to this workflow runs everything, so edits to CI are tested by CI.
          filters: |
            workflow: &workflow
              - ".github/workflows/ci.yml"
            docs:
              - *workflow
              - "**/*.md"
              - ".markdownlint.yaml"
            contracts:
              - *workflow
              - "contracts/**"
            node:
              - *workflow
              - "packages/**"
              - "contracts/gen/ts/**"
              - "services/catalog/**"
              - "services/gateway/**"
              - "apps/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.base.json"
              - "eslint.config.mjs"
              - ".prettierrc.json"
              - ".prettierignore"
              - ".node-version"
            inventory:
              - *workflow
              - "services/inventory/**"
              - "contracts/gen/go/**"
              - ".golangci.yml"

  # ---- Docs ----

  markdown:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: "**/*.md"

  links:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

  # ---- Contracts ----

  proto:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether main already has contracts
        id: base
        run: |
          if git cat-file -e origin/main:contracts/buf.yaml 2>/dev/null; then
            echo "has_contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_contracts=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.45.0 # keep in step with BUF_IMAGE in the Makefile
          input: contracts
          pr_comment: false
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' && steps.base.outputs.has_contracts == 'true' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main,subdir=contracts
          push: false
      - name: Generated code is up to date
        working-directory: contracts
        run: |
          buf generate
          if [ -n "$(git status --porcelain -- gen)" ]; then
            git status --short -- gen
            echo "contracts/gen is stale: run 'make contracts-generate' and commit the result"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: contracts/gen/go/go.mod
          cache-dependency-path: contracts/gen/go/go.sum
      - name: Generated Go module builds and is tidy
        working-directory: contracts/gen/go
        run: |
          go mod tidy -diff
          go build ./...
          go vet ./...

  openapi:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint OpenAPI specs and validate every example
        run: make contracts-openapi

  event-schemas:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schemas compile and every example validates
        run: make contracts-events

  # ---- Services ----

  inventory:
    needs: changes
    if: needs.changes.outputs.inventory == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inventory
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # this job runs third-party code, which never needs the token
      # v6 honours the toolchain directive, so CI uses the same Go as Docker and local builds.
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/inventory/go.mod
          cache-dependency-path: |
            services/inventory/go.sum
            contracts/gen/go/go.sum
      - name: Go version
        run: go version
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          # Build the linter with the module's toolchain so it understands the Go version in go.mod.
          install-mode: goinstall
          working-directory: services/inventory
      - name: Unit and integration tests (race detector, Testcontainers)
        run: go test -race -count=1 ./...
      - name: Image builds
        working-directory: .
        run: docker build -f services/inventory/Dockerfile -t sagamart-inventory:ci .

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # this job runs third-party code, which never needs the token
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Build first: services resolve workspace packages through their compiled type declarations.
      - name: Build
        run: pnpm build
      - name: Lint (ESLint, Prettier)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm test
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high
      - name: Catalog image builds
        run: docker build -f services/catalog/Dockerfile -t sagamart-catalog:ci .
      - name: Gateway image builds
        run: docker build -f services/gateway/Dockerfile -t sagamart-gateway:ci .

  # ---- Gate ----

  ci:
    if: always()
    needs: [changes, markdown, links, proto, openapi, event-schemas, node, inventory]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "$FAILED" = "true" ]; then echo "A required job failed or was cancelled"; exit 1; fi
