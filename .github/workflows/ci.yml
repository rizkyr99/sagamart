# One workflow for every PR. `changes` decides which areas are affected, area jobs run only when needed,
# and the final `ci` job is the single required check on main: it fails if any job that ran failed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A change to this workflow runs everything, so edits to CI are tested by CI.
          filters: |
            workflow: &workflow
              - ".github/workflows/ci.yml"
            docs:
              - *workflow
              - "**/*.md"
              - ".markdownlint.yaml"
            contracts:
              - *workflow
              - "contracts/**"

  # ---- Docs ----

  markdown:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: "**/*.md"

  links:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

  # ---- Contracts ----

  proto:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether main already has contracts
        id: base
        run: |
          if git cat-file -e origin/main:contracts/buf.yaml 2>/dev/null; then
            echo "has_contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_contracts=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.45.0 # keep in step with BUF_IMAGE in the Makefile
          input: contracts
          pr_comment: false
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' && steps.base.outputs.has_contracts == 'true' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main,subdir=contracts
          push: false

  event-schemas:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON Schemas compile
        run: npx --yes -p ajv-cli@5.0.0 -p ajv-formats@3.0.1 ajv compile --spec=draft2020 -c ajv-formats -s "contracts/events/**/*.schema.json"

  # ---- Gate ----

  ci:
    if: always()
    needs: [changes, markdown, links, proto, event-schemas]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "$FAILED" = "true" ]; then echo "A required job failed or was cancelled"; exit 1; fi
