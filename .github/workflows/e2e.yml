# End-to-end flows on the full Compose stack (RFC-0005 §9). Too slow for every PR, so it runs on main, on demand,
# and on PRs that change the flows or the stack itself. Not a required check: a failure on main is fixed forward.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "tests/e2e/**"
      - "packages/contract-testing/**"
      - "deploy/compose/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Local keys (a throwaway pair for this run)
        run: make identity-keys
      - name: Start the stack
        run: make demo
      - name: End-to-end flows
        run: make e2e
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/compose/infra.yml -f deploy/compose/services.yml --env-file deploy/compose/.env --profile services logs --no-color --tail 200 gateway catalog inventory
      - name: Stop the stack
        if: always()
        run: make down
