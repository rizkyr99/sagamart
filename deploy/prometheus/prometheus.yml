global:
  scrape_interval: 15s
  evaluation_interval: 15s

# One job per service; each exposes /metrics on its HTTP port. A service not running shows as a down target.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: inventory
    static_configs:
      - targets: ["inventory:8110"]
