global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Service scrape targets (each exposes /metrics) are added here as services land, one job per service.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
