# Local infrastructure for Sagamart. Services are added in their own compose files from Stage 1.
# Usage: make up  (or: docker compose -f deploy/compose/infra.yml --env-file deploy/compose/.env up -d)

x-postgres: &postgres
  image: postgres:17.2-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ---- Databases: one per service (ADR-0004) ----

  catalog-db:
    <<: *postgres
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports: ["${CATALOG_DB_PORT}:5432"]
    volumes: [catalog-db:/var/lib/postgresql/data]

  order-db:
    <<: *postgres
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports: ["${ORDER_DB_PORT}:5432"]
    volumes: [order-db:/var/lib/postgresql/data]

  payment-db:
    <<: *postgres
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports: ["${PAYMENT_DB_PORT}:5432"]
    volumes: [payment-db:/var/lib/postgresql/data]

  inventory-db:
    <<: *postgres
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports: ["${INVENTORY_DB_PORT}:5432"]
    volumes: [inventory-db:/var/lib/postgresql/data]

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    ports: ["${DYNAMODB_PORT}:8000"]
    volumes: [dynamodb:/home/dynamodblocal/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT}:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11.3
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    ports: ["${MEILI_PORT}:7700"]
    volumes: [meilisearch:/meili_data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Event log (ADR-0003) ----

  redpanda:
    image: redpandadata/redpanda:v24.2.10
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${REDPANDA_KAFKA_PORT}:19092"
      - "${REDPANDA_SCHEMA_REGISTRY_PORT}:18081"
      - "${REDPANDA_ADMIN_PORT}:9644"
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.8.0
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports: ["${REDPANDA_CONSOLE_PORT}:8080"]
    depends_on:
      redpanda: { condition: service_healthy }
      # Waiting for the one-shot init to complete also keeps `docker compose up --wait` from treating its exit as a failure.
      redpanda-init: { condition: service_completed_successfully }

  # Creates one topic per context, keyed by aggregate ID. Partition counts are revisited in RFC-0002.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.10
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in catalog.events order.events payment.events inventory.events; do
          rpk topic create "$$t" -p 6 -r 1 -X brokers=redpanda:9092 || true
          rpk topic create "$$t.dlq" -p 1 -r 1 -X brokers=redpanda:9092 || true
        done
    depends_on:
      redpanda: { condition: service_healthy }

  # ---- Observability platform ----

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [../otel/collector.yaml:/etc/otelcol/config.yaml:ro]
    ports:
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # In-memory storage is unbounded by default: a load test's traces once took 19 GB and starved the machine.
      MEMORY_MAX_TRACES: "50000"
    ports: ["${JAEGER_UI_PORT}:16686"]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports: ["${PROMETHEUS_PORT}:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["${GRAFANA_PORT}:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  catalog-db:
  order-db:
  payment-db:
  inventory-db:
  dynamodb:
  redis:
  meilisearch:
  redpanda:
  prometheus:
  grafana:
