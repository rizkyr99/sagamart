# Sagamart services. Started by `make demo` together with infra.yml; `make up` starts infrastructure only.
# Each service sits behind the "services" profile so it is never started by accident while you run it from source.

services:
  inventory:
    profiles: [services]
    build:
      context: ../..
      dockerfile: services/inventory/Dockerfile
      args:
        VERSION: ${SAGAMART_VERSION:-dev}
    restart: unless-stopped
    environment:
      INVENTORY_ENV: local
      INVENTORY_DB_URL: postgres://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory-db:5432/inventory?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      INVENTORY_KAFKA_BROKERS: redpanda:9092
      INVENTORY_IDENTITY_PUBLIC_KEYS: ${IDENTITY_PUBLIC_KEYS:?run make identity-keys}
    # Loopback only: the saga RPCs get their service identity in RFC-0002; until then, keep them off the network.
    ports:
      - "127.0.0.1:${INVENTORY_HTTP_PORT:-8110}:8110"
      - "127.0.0.1:${INVENTORY_GRPC_PORT:-9110}:9110"
    depends_on:
      inventory-db: { condition: service_healthy }
      otel-collector: { condition: service_started }
      redpanda-init: { condition: service_completed_successfully } # topics exist before the relay publishes

  catalog:
    profiles: [services]
    build:
      context: ../..
      dockerfile: services/catalog/Dockerfile
    restart: unless-stopped
    environment:
      CATALOG_ENV: local
      CATALOG_VERSION: ${SAGAMART_VERSION:-dev}
      CATALOG_DB_URL: postgres://${CATALOG_DB_USER}:${CATALOG_DB_PASSWORD}@catalog-db:5432/catalog
      CATALOG_DYNAMODB_ENDPOINT: http://dynamodb:8000
      CATALOG_IDENTITY_PUBLIC_KEYS: ${IDENTITY_PUBLIC_KEYS:?run make identity-keys}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # Loopback only, like inventory: internal APIs are for the gateway, not the network.
    ports:
      - "127.0.0.1:${CATALOG_HTTP_PORT:-8120}:8120"
    depends_on:
      catalog-db: { condition: service_healthy }
      dynamodb: { condition: service_healthy }
      otel-collector: { condition: service_started }

  gateway:
    profiles: [services]
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_ENV: local
      GATEWAY_VERSION: ${SAGAMART_VERSION:-dev}
      GATEWAY_DEV_AUTH: "true" # local only; the gateway refuses to start with it in prod
      GATEWAY_DEV_JWT_SECRET: ${GATEWAY_DEV_JWT_SECRET:?run make identity-keys}
      GATEWAY_IDENTITY_KEY_ID: ${IDENTITY_KEY_ID:?run make identity-keys}
      GATEWAY_IDENTITY_PRIVATE_KEY: ${IDENTITY_PRIVATE_KEY:?run make identity-keys}
      GATEWAY_CATALOG_URL: http://catalog:8120
      GATEWAY_INVENTORY_URL: http://inventory:9110
      GATEWAY_REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # The public entry point; still loopback-only on a dev machine.
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8100}:8100"
    depends_on:
      catalog: { condition: service_healthy }
      inventory: { condition: service_healthy }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
